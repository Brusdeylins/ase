#   [plugin] fetch Claude Code module type definitions (once)
lint-types {js}
    const fs   = require("node:fs")
    const file = "mods/claude-code.d.ts"
    const url  = "https://raw.githubusercontent.com/anthropics/claude-code/refs/heads/main/mods/types/claude-code.d.ts"
    if (!fs.existsSync(file)) {
        fetch(url).then((res) => {
            if (!res.ok)
                throw new Error(`failed to fetch ${url}: HTTP ${res.status}`)
            return res.text()
        }).then((text) => {
            fs.writeFileSync(file, text, "utf8")
        }).catch((err) => {
            console.error(err.message)
            process.exit(1)
        })
    }

#   [plugin] lint project
lint : lint-types
    echo "◉ lint: markdown (markdownlint)" && \
    markdownlint-cli2 --config etc/markdownlint.yaml "meta/*.md" "skills/**/*.md" "output-styles/*.md" "!meta/ase-format-specbook.md" && \
    echo "◉ lint: markdown (eslint)" && \
    eslint --config etc/eslint.mjs --ignore-pattern meta/ase-format-specbook.md meta skills output-styles && \
    echo "◉ lint: typescript (tsc)" && \
    tsc --project etc/tsc.json && \
    echo "◉ lint: typescript (claude)" && \
    claude plugin validate --strict .

#   [plugin] build project
build : lint
    (   for name in $(cd skills; ls -1 | grep -v ase-help-intent | sort); do
            echo "<purpose name=\"$name\">"
            cat skills/$name/help.md | sed -e '/^##  SEE ALSO/,$d'
            echo "</purpose>"
        done
    ) >skills/ase-help-intent/data.md
    specbook describe -p meta   -z 2 -f raw >meta/ase-format-specbook.md
    specbook describe -p schema -z 2 -f raw >meta/ase-format-specbook.yaml

#   [plugin] remove all generated files
clean
    shx rm -f meta/ase-format-specbook.md meta/ase-format-specbook.yaml

#   [plugin] remove all built files
distclean: clean
    shx rm -f package-lock.json
    shx rm -rf node_modules

