#   [plugin] lint project
lint
    markdownlint-cli2 --config etc/markdownlint.yaml meta/*.md skills/**/*.md && \
    eslint --config etc/eslint.mjs meta skills

#   [plugin] build project
build : lint
    (   for name in $(cd skills; ls -1 | grep -v ase-meta-intent | sort); do
            echo "<skill name=\"$name\">"
            cat skills/$name/help.md | sed -e '/^##  SEE ALSO/,$d'
            echo "</skill>"
        done
    ) >skills/ase-meta-intent/data.md

#   [plugin] remove all generated files
clean
    true

#   [plugin] remove all built files
distclean: clean
    shx rm -f package-lock.json
    shx rm -rf node_modules

