project:
    id: ase
    name: Agentic Software Engineering (ASE)
    boxing: grey
    artifact:
        spec:
            basedir: "docs/spec"
            files: "*.{md,txt}"
        code:
            basedir: "."
            files: "plugin/** tool/** !**/etc/** !**/{.gitignore,.npmignore,package.json}"
        docs:
            basedir: "."
            files: "docs/** pages/** **/{README,LICENSE,CHANGELOG}.{md,txt}
                !docs/{spec,arch}/**"
        infr:
            basedir: "."
            files: "bin/** **/{.github,.claude*,etc}/**
                **/{AGENTS.md,{package,tsconfig*}.json,.{git,npm}ignore}"
    task:
        lifecycle: enterprise
        default:
            source: "branch:master"
            changeset: "branch:cs-{id}"
            target: "branch:master"
    service:
        port: "43210"
agent:
    persona: engineer
    guidance: minimal
